<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" role="img" aria-label="ISS">
  <defs>
    <linearGradient id="iss-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="45%" stop-color="#c8941a"/>
      <stop offset="100%" stop-color="#8f6510"/>
    </linearGradient>
    <linearGradient id="iss-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#dbe3ee"/>
      <stop offset="100%" stop-color="#9aa8ba"/>
    </linearGradient>
    <linearGradient id="iss-truss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- lewe panele -->
  <g fill="url(#iss-panel)">
    <rect x="1" y="14" width="10" height="12" rx="0.6"/>
    <rect x="12" y="12" width="8" height="16" rx="0.5"/>
    <path d="M2 16h8M2 19h8M2 22h8M2 25h8" stroke="#5c4510" stroke-width="0.45" opacity="0.55"/>
    <path d="M13 14h6M13 17.5h6M13 21h6M13 24.5h6" stroke="#5c4510" stroke-width="0.45" opacity="0.55"/>
  </g>
  <!-- prawe panele -->
  <g fill="url(#iss-panel)">
    <rect x="53" y="14" width="10" height="12" rx="0.6"/>
    <rect x="44" y="12" width="8" height="16" rx="0.5"/>
    <path d="M54 16h8M54 19h8M54 22h8M54 25h8" stroke="#5c4510" stroke-width="0.45" opacity="0.55"/>
    <path d="M45 14h6M45 17.5h6M45 21h6M45 24.5h6" stroke="#5c4510" stroke-width="0.45" opacity="0.55"/>
  </g>
  <!-- główny truss -->
  <rect x="20" y="18.5" width="24" height="3" rx="0.8" fill="url(#iss-truss)"/>
  <!-- moduły -->
  <rect x="24" y="13" width="7" height="8.5" rx="1.2" fill="url(#iss-hull)"/>
  <rect x="33" y="14.5" width="6.5" height="7" rx="1" fill="url(#iss-hull)"/>
  <ellipse cx="28.5" cy="17.2" rx="1.6" ry="1.6" fill="#64748b" opacity="0.55"/>
  <ellipse cx="36.2" cy="18" rx="1.3" ry="1.3" fill="#64748b" opacity="0.45"/>
  <!-- PMA / węzeł -->
  <rect x="30.5" y="21.5" width="3" height="4" rx="0.6" fill="#cbd5e1"/>
  <!-- radiatory -->
  <rect x="22" y="22.5" width="4" height="2.2" rx="0.4" fill="#475569" opacity="0.85"/>
  <rect x="38" y="22.5" width="4" height="2.2" rx="0.4" fill="#475569" opacity="0.85"/>
